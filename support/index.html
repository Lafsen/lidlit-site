<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Support Lidlit</title>
<meta name="description" content="Lidlit is free. If you like it, you can chip in with a one-off tip by card, Apple Pay or PayPal. No account needed.">
<link rel="canonical" href="https://lidlit.app/support/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lidlit">
<meta property="og:url" content="https://lidlit.app/support/">
<meta property="og:title" content="Support Lidlit">
<meta property="og:description" content="Lidlit is free. If it lights up your day, you can chip in.">
<meta property="og:image" content="https://lidlit.app/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="48x48" href="/img/favicon-48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root { --ink: #f5f5f7; --ink-2: #a1a1a6; --ink-3: #6e6e73; --hair: rgba(255,255,255,.12);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #000; color: var(--ink); font: 400 17px/1.5 var(--font);
  display: grid; place-items: center; padding: 40px 20px; text-align: center; }
main { display: grid; justify-items: center; gap: 16px; max-width: 420px; }
h1 { margin: 0; font-size: 2.2rem; letter-spacing: -.025em; }
p { margin: 0; color: var(--ink-2); }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 12px 24px; background: var(--ink); color: #000;
  font: 600 1rem var(--font); text-decoration: none; margin-top: 6px; }
.btn:hover { opacity: .85; }
.small { font-size: .85rem; color: var(--ink-3); }
.small a { color: var(--ink-2); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/img/icon.png" alt="" width="88" height="88">
  <h1>Support Lidlit</h1>
  <p>Lidlit is free and stays free. If it lights up your day, you can chip in for a coffee.</p>
  <!-- The one place the donation link lives. The app and the site link here (lidlit.app/support). -->
  <a class="btn" id="give" href="https://ko-fi.com/lidlit" data-goatcounter-click="donate-kofi" rel="noopener">♡ Chip in</a>
  <p class="small">Any amount, one-off. Card, Apple Pay or PayPal, no account needed.</p>
  <p class="small"><a href="/">Back to Lidlit</a></p>
</main>
<!-- Visitor counts: GoatCounter, no cookies, no personal data. -->
<script data-goatcounter="https://lidlit.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
